<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Life Mirror - 2Dアバターテスト</title>
    <link rel="stylesheet" href="./styles.css?v=3" />
  </head>
  <body>
    <main class="test-page">
      <section class="test-card" aria-labelledby="page-title">
        <header class="test-header">
          <p class="eyebrow">LIFE MIRROR</p>
          <h1 id="page-title">2Dアバター 状態テスト</h1>
          <p>ボタンまたはスライダーで、健康状態を10段階に切り替えられます。</p>
        </header>

        <div class="preview-area">
          <!-- level属性を1〜10にすると、アバターの状態が変わります。 -->
          <life-mirror-avatar id="avatar" level="5"></life-mirror-avatar>
        </div>

        <div class="status-panel" aria-live="polite">
          <span id="levelBadge" class="level-badge">LEVEL 5</span>
          <h2 id="statusName">普通</h2>
          <p id="statusDescription">落ち着いた標準の状態です。</p>
        </div>

        <div class="controls">
          <label for="levelSlider">健康レベル：<strong id="levelValue">5</strong></label>
          <input id="levelSlider" type="range" min="1" max="10" value="5" />
          <div id="levelButtons" class="level-buttons" aria-label="健康レベルを選ぶ"></div>
        </div>
        <fieldset class="creator-panel">
          <legend>キャラクリエイト</legend>
          <label>アクセサリー<select id="accessory"><option value="none">なし</option><option value="glasses">めがね</option><option value="hairpin">ヘアピン</option><option value="headphones">ヘッドホン</option></select></label>
        </fieldset>
        <fieldset class="animation-panel">
          <legend>アニメーション</legend>
          <label>動き<select id="animationMode"><option value="idle">待機</option><option value="walk">歩行</option></select></label>
          <label>向き<select id="direction"><option value="right">右向き</option><option value="left">左向き</option></select></label>
        </fieldset>
      </section>
    </main>

    <script src="./AvatarRasterCreator.js?v=32"></script>
    <script>
      // Avatar.js側と同じ変数名を使うと再宣言エラーになるため、別名で受け取ります。
      const avatarStates = window.AVATAR_STATES;

      // 画面で使う要素を取得します。
      const avatar = document.querySelector('#avatar');
      const slider = document.querySelector('#levelSlider');
      const levelValue = document.querySelector('#levelValue');
      const levelBadge = document.querySelector('#levelBadge');
      const statusName = document.querySelector('#statusName');
      const statusDescription = document.querySelector('#statusDescription');
      const buttonArea = document.querySelector('#levelButtons');

      // 選択されたレベルを、アバターと説明文の両方へ反映します。
      function changeLevel(level) {
        const state = avatarStates[level];
        avatar.level = level;
        slider.value = level;
        levelValue.textContent = level;
        levelBadge.textContent = `LEVEL ${level}`;
        statusName.textContent = state.name;
        statusDescription.textContent = state.description;

        document.querySelectorAll('.level-button').forEach((button) => {
          const selected = Number(button.dataset.level) === level;
          button.classList.toggle('is-selected', selected);
          button.setAttribute('aria-pressed', String(selected));
        });
      }

      // 1〜10のボタンを自動で作ります。
      for (let level = 1; level <= 10; level += 1) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'level-button';
        button.dataset.level = level;
        button.textContent = level;
        button.title = avatarStates[level].name;
        button.addEventListener('click', () => changeLevel(level));
        buttonArea.append(button);
      }

      slider.addEventListener('input', () => changeLevel(Number(slider.value)));
      // キャラクリエイトの変更をアバターへ反映します。
      const creatorInputs = {
        accessory: document.querySelector('#accessory'),
      };
      Object.entries(creatorInputs).forEach(([attribute, input]) => {
        input.addEventListener('input', () => avatar.setAttribute(attribute, input.value));
      });
      document.querySelector('#animationMode').addEventListener('change', (event) => avatar.setAttribute('animation', event.target.value));
      document.querySelector('#direction').addEventListener('change', (event) => avatar.setAttribute('direction', event.target.value));
      avatar.setAttribute('animation', 'idle');
      avatar.setAttribute('direction', 'right');
      changeLevel(5);
    </script>
  </body>
</html>
