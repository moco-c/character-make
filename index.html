<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Life Mirror - マイルーム</title>
    <link rel="stylesheet" href="./styles.css?v=10" />
  </head>
  <body>
    <main class="room-page">
      <header class="room-header">
        <div>
          <p class="eyebrow">LIFE MIRROR</p>
          <h1>マイルーム</h1>
        </div>
        <div class="health-summary" aria-live="polite">
          <span id="levelBadge" class="level-badge">LEVEL 5</span>
          <strong id="statusName">普通</strong>
        </div>
      </header>

      <section class="room-stage" aria-label="アバターの部屋">
        <!-- 元の完成画像と同じ座標へ、家具を個別に配置します。 -->
        <img class="room-item room-window" src="./assets/room/window-matched-clean.png" alt="窓とカーテン" />
        <img class="room-item room-picture" src="./assets/room/picture-matched-clean.png" alt="壁の絵" />
        <img class="room-item room-wardrobe" src="./assets/room/wardrobe-matched-clean.png" alt="クローゼット" />
        <img class="room-item room-plant" src="./assets/room/plant-matched-clean-v2.png" alt="観葉植物" />
        <img class="room-item room-shelf" src="./assets/room/shelf-matched-clean.png" alt="壁の棚" />
        <img class="room-item room-bed" src="./assets/room/bed-matched-clean.png" alt="ベッド" />
        <img class="room-item room-table" src="./assets/room/table-matched-clean.png" alt="ローテーブル" />
        <img class="room-item room-cushion" src="./assets/room/cushion-matched-clean.png" alt="座布団" />
        <!-- 既存のアバターコンポーネントを部屋の床に配置します。 -->
        <life-mirror-avatar
          id="avatar"
          class="room-avatar"
          level="5"
          animation="idle"
          direction="right"
        ></life-mirror-avatar>
      </section>

      <section class="room-controls" aria-label="アバター操作">
        <div class="level-control">
          <label for="levelSlider">健康レベル <strong id="levelValue">5</strong></label>
          <input id="levelSlider" type="range" min="1" max="10" value="5" />
        </div>
        <label>
          動き
          <select id="animationMode">
            <option value="idle">待機</option>
            <option value="walk">歩行</option>
          </select>
        </label>
        <label>
          向き
          <select id="direction">
            <option value="right">右向き</option>
            <option value="left">左向き</option>
          </select>
        </label>
      </section>
    </main>

    <script src="./AvatarRasterCreator.js?v=40"></script>
    <script>
      const avatar = document.querySelector('#avatar');
      const slider = document.querySelector('#levelSlider');
      const levelValue = document.querySelector('#levelValue');
      const levelBadge = document.querySelector('#levelBadge');
      const statusName = document.querySelector('#statusName');

      // スライダーの値をアバターと画面上の表示へ反映します。
      function changeLevel(level) {
        avatar.level = level;
        levelValue.textContent = level;
        levelBadge.textContent = `LEVEL ${level}`;
        statusName.textContent = window.AVATAR_STATES[level].name;
      }

      slider.addEventListener('input', () => changeLevel(Number(slider.value)));
      document.querySelector('#animationMode').addEventListener('change', (event) => {
        avatar.setAttribute('animation', event.target.value);
      });
      document.querySelector('#direction').addEventListener('change', (event) => {
        avatar.setAttribute('direction', event.target.value);
      });
      changeLevel(5);
    </script>
  </body>
</html>
